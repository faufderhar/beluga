[package]
name = "beluga-mac"
version = "0.4.0"
description = "Beluga for macOS"
edition = "2021"
publish = false

[lib]
name = "beluga_mac_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-updater = "2"
# Settings › Voice › From any app: the talk shortcut, wherever you are.
tauri-plugin-global-shortcut = "2"
window-vibrancy = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
tokio = { version = "1", features = ["time", "sync"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_SystemInformation", "Win32_UI_Input_KeyboardAndMouse"] }
# Where dropped files are (src/drop_paths.rs): the versions Tauri itself uses, so the types are the same.
webview2-com = "0.39"
windows-core = "0.62"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
# The app's menus as the Mac's own (src/native_menu.rs).
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSCell", "NSControl", "NSEvent", "NSGraphics", "NSImage", "NSMenu", "NSMenuItem", "NSResponder", "NSScreen", "NSUserInterfaceItemIdentification", "NSUserInterfaceValidation", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSGeometry", "NSString"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "UNUserNotificationCenter", "UNNotificationSettings"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
